<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Pet Management System</h1>

    <div class="container">

        <h2>Pets</h2>

        <button onclick="loadPets()">Load Pets</button>

        <div id="pets"></div>

    </div>
   
    <div class="container">

        <h2>Adoption Analytics by Breed</h2>

        <button onclick="loadAdoptionAnalytics()">
            Load Adoption Analytics
        </button>

        <div id="adoptionAnalytics"></div>

    </div>
    
    <div class="container">

        <h2>Medical Status Comparison</h2>

        <button onclick="loadMedicalAnalytics()">
            Load Medical Analytics
        </button>

        <div id="medicalAnalytics"></div>

    </div>
    
    <div class="container">

        <h2>Above Average Spending Categories</h2>

        <button onclick="loadExpenseAnalytics()">
            Load Expense Analytics
        </button>

        <div id="expenseAnalytics"></div>

    </div>
    

    <script src="app.js"></script>

</body>

</html>
